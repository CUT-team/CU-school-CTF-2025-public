services:
  mongo:
    image: mongo
    restart: always
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - mongo
    environment:
      - PUBLIC_URL=http://localhost:8080

  app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8099:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    
volumes:
  mongo_data: