server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static frontend files
    location / {
        try_files $uri /index.html;
    }

    # Proxy API requests to FastAPI
    location /api/ {
        proxy_pass http://app:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    
    # Allow flag to be accessed only from local network
    location /flag {
        # Allow only private/local network ranges (adjust as needed)
        allow 127.0.0.1;       # Localhost
        allow 10.0.0.0/8;      # Private network
        allow 172.16.0.0/12;   # Private network
        allow 192.168.0.0/16;  # Private network
        deny all;              # Block all others

        # Serve the file
        alias /flag.txt;
        default_type text/plain;

        # Security headers (optional)
        add_header X-Content-Type-Options "nosniff";
        add_header Content-Security-Policy "default-src 'none'";
    }
}
