worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    server {
        listen 80;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
            add_header Set-Cookie "secret=LzlhMmVmOTZmLWY0NWItNGU1Yy1hYzFkLWMxMTVkN2UwZTMwZS5odG1s; Path=/; HttpOnly";
        }
    }
}
