services:
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ctf_network

  flask_app:
    container_name: ${COMPOSE_PROJECT_NAME}_flask_app
    build: ./flask_app
    ports:
      - "127.0.0.1:${FLASK_APP_PORT}:5000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data:rw
      - ./.env:/app/.env:ro  # Mount .env file as read-only
    env_file:
      - ./.env  # Use the .env file for environment variables
    restart: unless-stopped
    stop_signal: SIGINT
    depends_on:
      postgres:
        condition: service_healthy
      generic_ctf_task:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 1G
    memswap_limit: 1G
    cpus: 1.0
    pids_limit: 1000
    networks:
      - ctf_network
  
  generic_ctf_task:
    container_name: ${COMPOSE_PROJECT_NAME}_local_stub
    build: 
      context: ./generic_ctf_task
      dockerfile: Dockerfile
    image: ${IMAGES_NAME}
    environment:
      MNEMONIC: "tourist frame critic siren upgrade profit swamp submit goose chase film uncle"
      ACCOUNT1: "0x41751623c51dd2cd40582459070bd333a9574eec5e4e48fec90d141c2c6e9da9,10000000000000000000000000"
      ACCOUNT2: "0x9e55ca5ba72cf3840328380cbd57db565c998bc08e863a32390d1b64283eefb7,100000000000000000000"
      RPC_PORT: "8545"
    # Port mapping below is only for direct testing
    # When deployed by flask_app, it will use dynamic ports in the 9000-10000 range
    ports:
      - "127.0.0.1:${DIRECT_TEST_PORT}:${PORT_IN_CONTAINER}"  # For direct testing access
    security_opt:
      - no-new-privileges:${ENABLE_NO_NEW_PRIVILEGES}
    mem_limit: ${CONTAINER_MEMORY_LIMIT}
    memswap_limit: ${CONTAINER_SWAP_LIMIT}
    cpus: ${CONTAINER_CPU_LIMIT}
    pids_limit: ${CONTAINER_PIDS_LIMIT}
    networks:
      - ctf_network

networks:
  ctf_network:
    name: ${NETWORK_NAME}
    driver: bridge
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET}

volumes:
  postgres_data:
